[package]
name = "yt_human_workflow"
version = "0.1.0"
description = "Human-in-the-loop operator workstation"
authors = ["OpenAI"]
edition = "2021"

[lib]
name = "yt_human_workflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.0" }

[dependencies]
tauri = { version = "2.8.0", features = [] }
tauri-plugin-opener = "2.5.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
